<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PhronexusAI Outreach</title>
<link rel="icon" href="/favicon-192.png">
<style>
:root{--bg:#f5f6f9;--card:#ffffff;--txt:#141625;--mut:#5d6474;--line:#e2e5ec;--acc:#3b6ef0;--acc-txt:#fff;--acc-soft:#eaf0fe;--ok:#12805c;--warn:#a15c00;--err:#c0352b;--chip:#f0f2f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#161b24;--txt:#e9ecf2;--mut:#9aa3b3;--line:#262d3a;--acc:#5b86f5;--acc-txt:#fff;--acc-soft:#1b2540;--ok:#3fbf8f;--warn:#e0a24a;--err:#f07067;--chip:#1e2430}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#161b24;--txt:#e9ecf2;--mut:#9aa3b3;--line:#262d3a;--acc:#5b86f5;--acc-txt:#fff;--acc-soft:#1b2540;--ok:#3fbf8f;--warn:#e0a24a;--err:#f07067;--chip:#1e2430}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc)}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--txt);text-decoration:none}
.logo img{width:28px;height:28px;border-radius:7px}
.logo span{color:var(--mut);font-weight:500}
.top-sp{flex:1}
main{max-width:1120px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-txt)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:190px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.filters input{flex:1 1 220px}
.count{color:var(--mut);font-size:13px;margin:0 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.biz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.biz .d{font-weight:700;font-size:15px}
.biz .e{color:var(--mut);font-size:13px;margin:2px 0 8px;overflow-wrap:anywhere}
.biz p{margin:8px 0 0;font-size:13.5px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}
.chip.k{background:var(--acc-soft);color:var(--acc)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:18px 0 0;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin:0 0 18px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--txt)}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-txt)}
.banner{border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:14px}
.banner.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.banner.off{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.row{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
label + input,label + select{width:100%}
.help{font-size:12.5px;color:var(--mut);margin:4px 0 0}
.msg{font-size:13.5px;margin:10px 0 0}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.cubes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 14px}
.cube{background:var(--chip);border-radius:10px;padding:10px 12px}
.cube b{display:block;font-size:22px}
.cube span{font-size:12px;color:var(--mut)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--chip)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.yes{color:var(--ok);font-weight:600}.no{color:var(--mut)}
.prev{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
.conn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot.bad{background:var(--err)}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{width:min(420px,100%);margin:0}
.hide{display:none!important}
details summary{cursor:pointer;font-size:13px;color:var(--mut);margin:10px 0 0}
.empty{color:var(--mut);font-size:14px;padding:18px 4px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="/outreach"><img src="/favicon-192.png" alt=""> PhronexusAI <span>Outreach</span></a>
  <div class="top-sp"></div>
  <button class="btn pri" id="btnSignIn">Client sign in</button>
  <button class="btn hide" id="btnSignOut">Sign out</button>
</div></header>
<main id="app"><p class="empty">Loading…</p></main>

<div class="modal hide" id="modal"><div class="card">
  <h2>Client sign in</h2>
  <p class="sub" style="margin:4px 0 8px">Enter the access code we sent you.</p>
  <form id="formCode">
    <input id="inpCode" placeholder="PX-XXXX-XXXX-XXXX-XXXX" autocomplete="off" style="width:100%;text-transform:uppercase">
    <p class="msg err hide" id="codeErr"></p>
    <div class="acts"><button class="btn pri" type="submit">Sign in</button><button class="btn" type="button" id="btnCancel">Cancel</button></div>
  </form>
</div></div>
<script src="/js/pxse-portali.js?v=1"></script>
</body>
</html>
